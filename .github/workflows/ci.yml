name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Quality gate: lint, type-check, build
  # ────────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings 0

      - name: Build production bundle
        run: npm run build
        env:
          # Stub env vars so Next.js does not crash during static generation
          DATABASE_URL: postgresql://postgres:password@localhost:5432/next_pizza
          NEXTAUTH_SECRET: ci-test-secret-not-real
          NEXTAUTH_URL: http://localhost:3000

  # ────────────────────────────────────────────────────────────────────────────
  # Docker image build & push (only on push to main after quality gate passes)
  # ────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/next-pizza:latest
            ghcr.io/${{ github.repository_owner }}/next-pizza:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/next-pizza-worker:latest
            ghcr.io/${{ github.repository_owner }}/next-pizza-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
